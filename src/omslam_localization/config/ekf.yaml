ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false
    permit_corrected_publication: false
    reset_on_time_jump: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    use_control: false
    # Encoder pose is derived from the same measurements; fuse twist only.
    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true, false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 5
    odom0_differential: false
    odom0_relative: false
    imu0: /imu/data
    # Selection is in the sensor frame. Keep all three gyro axes so any mount
    # rotation can project into base yaw. TF rotates gyro/covariance first;
    # two_d_mode then constrains base roll/pitch rates to zero.
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true, true, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
