# Nav2 1.3.13 interfaces and plugin topology. Motion/timing initial values live
# in sim_profile.yaml. Launch merges both, validates, then resolves asset paths.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    default_nav_to_pose_bt_xml: behavior_trees/navigate_bounded.xml
    error_code_names: [compute_path_error_code, follow_path_error_code]

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerLattice
      lattice_filepath: config/lattice/diff_5cm_16h_r0p5.json
      allow_unknown: false
      allow_reverse_expansion: false
      cache_obstacle_heuristic: false
      smooth_path: true

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: [FollowPath]
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    progress_checker:
      plugin: omslam_navigation::SpeedAwareProgressChecker
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      stateful: false
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      trajectory_generator_name: omslam_navigation::SpeedAwareTrajectoryGenerator
      critics: [ObstacleFootprint, RotateToGoal, Oscillation, GoalAlign, PathAlign, PathDist, GoalDist]
      short_circuit_trajectory_evaluation: true
      stateful: true
      publish_evaluation: true
      publish_trajectories: false
      debug_trajectory_details: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      footprint: '[[0.09,0.26],[0.09,-0.26],[-0.39,-0.26],[-0.39,0.26]]'
      footprint_padding: 0.02
      plugins: [static_layer, obstacle_layer, camera_memory, keepout, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.15
          obstacle_max_range: 8.0
          raytrace_min_range: 0.15
          raytrace_max_range: 10.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      camera_memory:
        plugin: omm_costmap_layers::ObstacleMemoryLayer
        padding: 0.06
      keepout:
        plugin: omm_costmap_layers::KeepoutLayer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: '[[0.09,0.26],[0.09,-0.26],[-0.39,-0.26],[-0.39,0.26]]'
      footprint_padding: 0.02
      plugins: [obstacle_layer, camera_memory, keepout, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.15
          obstacle_max_range: 8.0
          raytrace_min_range: 0.15
          raytrace_max_range: 10.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      camera_memory:
        plugin: omm_costmap_layers::ObstacleMemoryLayer
        padding: 0.06
      keepout:
        plugin: omm_costmap_layers::KeepoutLayer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    local_costmap_topic: /local_costmap/costmap_raw
    global_costmap_topic: /global_costmap/costmap_raw
    local_footprint_topic: /local_costmap/published_footprint
    global_footprint_topic: /global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors::Wait

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    stamp_smoothed_velocity_with_smoothing_time: false
    feedback: OPEN_LOOP
    scale_velocities: true
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel/smoothed
    cmd_vel_out_topic: /cmd_vel/monitored
    state_topic: /collision_monitor_state
    base_shift_correction: true
    polygons: [Stop, Approach]
    Stop:
      type: polygon
      action_type: stop
      points: '[[0.31,0.28],[0.31,-0.28],[-0.41,-0.28],[-0.41,0.28]]'
      min_points: 1
      enabled: true
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_polygon
    Approach:
      type: polygon
      action_type: approach
      # Static padded footprint avoids waiting for a costmap footprint during
      # downstream-first lifecycle activation; launch verifies exact agreement.
      points: '[[0.11,0.28],[0.11,-0.28],[-0.41,-0.28],[-0.41,0.28]]'
      min_points: 1
      enabled: true
      visualize: true
      polygon_pub_topic: /collision_monitor/approach_polygon
    observation_sources: [scan, obstacles]
    scan:
      type: scan
      topic: /scan
      enabled: true
    obstacles:
      type: pointcloud
      topic: /perception/obstacles
      min_height: 0.02
      max_height: 0.30
      use_global_height: false
      enabled: true

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [collision_monitor, velocity_smoother, planner_server, controller_server, behavior_server, bt_navigator]
    bond_timeout: 4.0
    attempt_respawn_reconnection: false
