# Simulation depth uses metres (32FC1) and valid IMU orientation.
# Hardware HFI-A9 gyro-only orientation is not a substitute for this input.
obstacle_memory:
  ros__parameters:
    use_sim_time: true
    depth_reliable: true
    memory_frame: odom
    base_frame: base_footprint
    voxel_size: 0.05
    max_voxels: 100000
    min_height: 0.02
    max_height: 0.30
    min_depth: 0.12
    max_depth: 5.0
    sensor_timeout: 0.30
    clear_margin: 0.10
    free_frames: 5
    pixel_stride: 2
    active_radius: 6.0
    max_archive_cells: 4096
    max_ground_slope: 0.35
    require_imu: true
