# Simulation motion and timing profile (70 RPM wheel cap at r=0.068 m).
planner_server:
  ros__parameters:
    GridBased:
      tolerance: 0.10
      analytic_expansion_max_length: 4.0
      max_planning_time: 2.0

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    failure_tolerance: 0.30
    progress_checker:
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    goal_checker:
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.15
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.02
    FollowPath:
      min_vel_x: 0.0
      max_vel_x: 0.49846603436958054
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.50
      min_speed_xy: 0.0
      max_speed_xy: 0.49846603436958054
      min_speed_theta: 0.0
      acc_lim_x: 0.40
      acc_lim_y: 0.0
      acc_lim_theta: 0.60
      decel_lim_x: -0.80
      decel_lim_y: 0.0
      decel_lim_theta: -1.00
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.20
      ObstacleFootprint.scale: 0.02
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.scale: 1.0
      GoalAlign.scale: 24.0
      PathAlign.scale: 32.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 4.0
      publish_frequency: 4.0
      transform_tolerance: 0.20
      inflation_layer:
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.20
      inflation_layer:
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

behavior_server:
  ros__parameters:
    transform_tolerance: 0.20

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 50.0
    max_velocity: [0.49846603436958054, 0.0, 0.50]
    min_velocity: [0.0, 0.0, -0.50]
    max_accel: [0.40, 0.0, 0.60]
    max_decel: [-0.80, 0.0, -1.00]
    velocity_timeout: 0.30
